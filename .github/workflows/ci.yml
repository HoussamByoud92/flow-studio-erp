name: Flow Studio ERP CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Java Services (MS1, MS2, MS3, MS5) ──
  build-java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, rh-service, project-service, dashboard-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5672:5672']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build & Test
        run: mvn clean verify -Dspring.profiles.active=test
      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  # ── Python AI Service (MS4) ──
  build-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Run Tests
        run: pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage
          path: ai-service/coverage.xml

  # ── Gate: Block merge if any test fails ──
  gate:
    needs: [build-java, build-python]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All tests passed. Merge is allowed."